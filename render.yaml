services:
  - type: web
    name: ai-marketing-platform
    runtime: node
    # Root is the repo root — NOT backend/
    buildCommand: npm install && npm run build && npm run install:backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
